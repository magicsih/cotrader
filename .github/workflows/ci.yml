name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # The toolchain is named in go.mod and fetched through the checksum-verified
  # module proxy, so no separate setup action is pinned here.
  GOTOOLCHAIN: auto
  GOLANGCI_LINT_VERSION: v2.13.2
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:9.2.0
        env:
          MYSQL_ROOT_PASSWORD: isolated-test-root
          MYSQL_DATABASE: cotrader_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pisolated-test-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "gofmt이 필요한 파일:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      - name: Lint
        run: |
          set -euo pipefail
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: Tests
        env:
          # Each test package creates its own schema, so the account needs
          # rights to create databases.
          COTRADER_TEST_DSN: root:isolated-test-root@tcp(127.0.0.1:3306)/cotrader_test
        run: go test -race ./...
      - name: Scan public Git history for credentials
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No QEMU: the build stage runs on the native architecture and Go cross
      # compiles, so both images are built without emulation.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
      - name: Record immutable deployment image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE_REPOSITORY@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: vzyx-cluster
    steps:
      - name: Install pinned kubectl
        env:
          KUBECTL_VERSION: v1.35.8
          KUBECTL_SHA256: 874d5e72dbb819f43cff16bcd1e4f8bac5b7f2361fe1e55049b0a6c676fb0cbf
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/kubectl" \
            "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$KUBECTL_SHA256  $RUNNER_TEMP/bin/kubectl" | sha256sum --check --status
          chmod 0755 "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Write kubeconfig and mask the cluster endpoint
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          server=$(KUBECONFIG="$RUNNER_TEMP/kube/config" \
            kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          host=${server#*://}
          host=${host%%:*}
          echo "::add-mask::$server"
          echo "::add-mask::$host"
          for address in $(getent ahosts "$host" | awk '{print $1}' | sort -u); do
            echo "::add-mask::$address"
          done
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Roll out the published digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "publish job did not report an image digest" >&2; exit 1 ;;
          esac
          kubectl -n cotrader set image deployment/cotrader-bot "*=$IMAGE"
          kubectl -n cotrader rollout status deployment/cotrader-bot --timeout=10m
      - name: Report the running workload
        if: success() || failure()
        run: |
          set -euo pipefail
          kubectl -n cotrader get deployment \
            -o custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,READY:.status.readyReplicas \
            >> "$GITHUB_STEP_SUMMARY"
          kubectl -n cotrader get configmap cotrader-config \
            -o custom-columns=TOSS:.data.COTRADER_TOSS_ORDERS_ENABLED,KRW:.data.COTRADER_UPBIT_KRW_ORDERS_ENABLED,USDT:.data.COTRADER_UPBIT_USDT_ORDERS_ENABLED,TRANSFERS:.data.COTRADER_UPBIT_TRANSFERS_ENABLED \
            >> "$GITHUB_STEP_SUMMARY"
          kubectl -n cotrader get pods --no-headers \
            -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,RESTARTS:.status.containerStatuses[0].restartCount
