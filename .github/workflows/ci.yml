name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.10'
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations scripts/check-public.py
      - run: uv run ruff format --check src tests migrations scripts/check-public.py
      - run: python3 scripts/check-public.py
      - name: Scan public Git history for credentials
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: MySQL integration tests
        run: bash scripts/test-mysql.sh -q
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.3.0'
          run_install: false
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
      - name: Record immutable deployment image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE_REPOSITORY@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: vzyx-cluster
    steps:
      - name: Install pinned kubectl
        env:
          KUBECTL_VERSION: v1.35.8
          KUBECTL_SHA256: 874d5e72dbb819f43cff16bcd1e4f8bac5b7f2361fe1e55049b0a6c676fb0cbf
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/kubectl" \
            "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$KUBECTL_SHA256  $RUNNER_TEMP/bin/kubectl" | sha256sum --check --status
          chmod 0755 "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Write kubeconfig and mask the cluster endpoint
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          server=$(KUBECONFIG="$RUNNER_TEMP/kube/config" \
            kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          host=${server#*://}
          host=${host%%:*}
          echo "::add-mask::$server"
          echo "::add-mask::$host"
          for address in $(getent ahosts "$host" | awk '{print $1}' | sort -u); do
            echo "::add-mask::$address"
          done
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Roll out the published digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          DAILY_LOSS_USDT: ${{ vars.COTRADER_DAILY_LOSS_USDT }}
          DRAWDOWN_USDT: ${{ vars.COTRADER_DRAWDOWN_USDT }}
          AUTO_RECOVER_USDT: ${{ vars.COTRADER_UPBIT_USDT_AUTO_RECOVER }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "publish job did not report an image digest" >&2; exit 1 ;;
          esac
          patch=$(python3 - <<'PY'
          import json
          import os
          from decimal import Decimal, InvalidOperation

          names = ("DAILY_LOSS_USDT", "DRAWDOWN_USDT")
          values = {}
          for name in names:
              raw = os.environ.get(name, "")
              try:
                  value = Decimal(raw)
              except InvalidOperation:
                  raise SystemExit(f"{name} must be a decimal") from None
              if not value.is_finite() or value <= 0:
                  raise SystemExit(f"{name} must be a positive finite decimal")
              values[name] = raw
          if Decimal(values["DAILY_LOSS_USDT"]) > Decimal(values["DRAWDOWN_USDT"]):
              raise SystemExit("DAILY_LOSS_USDT must not exceed DRAWDOWN_USDT")
          auto = os.environ.get("AUTO_RECOVER_USDT", "").lower()
          if auto not in {"true", "false"}:
              raise SystemExit("AUTO_RECOVER_USDT must be true or false")
          print(json.dumps({"data": {
              "COTRADER_DAILY_LOSS_USDT": values["DAILY_LOSS_USDT"],
              "COTRADER_DRAWDOWN_USDT": values["DRAWDOWN_USDT"],
              "COTRADER_UPBIT_USDT_AUTO_RECOVER": auto,
          }}))
          PY
          )
          kubectl -n cotrader patch configmap cotrader-config --type merge --patch "$patch"
          for name in cotrader-api cotrader-research cotrader-engine; do
            kubectl -n cotrader set image "deployment/$name" "*=$IMAGE"
            kubectl -n cotrader rollout status "deployment/$name" --timeout=10m
          done
      - name: Report the running workloads
        if: success() || failure()
        run: |
          set -euo pipefail
          kubectl -n cotrader get deployment \
            -o custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,READY:.status.readyReplicas \
            >> "$GITHUB_STEP_SUMMARY"
          kubectl -n cotrader get configmap cotrader-config \
            -o custom-columns=DAILY_LOSS_USDT:.data.COTRADER_DAILY_LOSS_USDT,DRAWDOWN_USDT:.data.COTRADER_DRAWDOWN_USDT,AUTO_RECOVER_USDT:.data.COTRADER_UPBIT_USDT_AUTO_RECOVER \
            >> "$GITHUB_STEP_SUMMARY"
          kubectl -n cotrader get pods --no-headers -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,RESTARTS:.status.containerStatuses[0].restartCount
