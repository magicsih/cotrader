# GitHub Actions 배포 전용 자격이다. Deployment 이미지 교체와 롤아웃 확인만 허용하고
# Secret, ConfigMap, Ingress에는 접근하지 않는다. 토큰 값은 클러스터가 채우며 저장소에 넣지 않는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-deployer
subjects:
  - kind: ServiceAccount
    name: github-deployer
