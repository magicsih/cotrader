apiVersion: apps/v1
kind: Deployment
metadata:
  name: cotrader-bot
spec:
  replicas: 1
  # Only one process may hold the order lock, so the old pod must be gone
  # before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: cotrader, role: bot}
  template:
    metadata:
      labels: {app: cotrader, role: bot}
    spec:
      automountServiceAccountToken: false
      # Long enough for an in-flight order submission to finish.
      terminationGracePeriodSeconds: 90
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      containers:
        - name: bot
          image: cotrader
          envFrom:
            - configMapRef: {name: cotrader-config}
            - secretRef: {name: cotrader-database}
            - secretRef: {name: cotrader-identity}
            - secretRef: {name: cotrader-toss, optional: true}
            - secretRef: {name: cotrader-upbit, optional: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 48Mi}
            limits: {cpu: 500m, memory: 128Mi}
