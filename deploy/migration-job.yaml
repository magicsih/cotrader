# 이미지 digest와 namespace, Secret을 검증한 다음 별도 승인된 배포 단계에서만 실행합니다.
apiVersion: batch/v1
kind: Job
metadata:
  name: cotrader-migrate
  namespace: cotrader
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: migrate
          image: ghcr.io/your-account/cotrader:REPLACE_WITH_VERIFIED_COMMIT
          command: [alembic, upgrade, head]
          envFrom:
            - secretRef: {name: cotrader-migration-database}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
