[project]
name = "cotrader"
version = "0.1.0"
description = "개인 계좌용 미국 주식·업비트 원화 코인 전략 실행 및 검증 도구"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncmy>=0.2,<1",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "websockets>=15,<17",
  "cryptography>=44",
  "optuna>=4.9,<5",
  "exchange-calendars>=4.13.2,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "aiosqlite>=0.21,<1"]

[project.scripts]
cotrader = "cotrader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
